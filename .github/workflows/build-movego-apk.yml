name: Build MoveGo APK

on:
  push:
    branches: [main]
    paths:
      - "payload/**"
      - ".github/workflows/build-movego-apk.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Restore MoveGo project
        run: |
          cat payload/chunk_00.b64 payload/chunk_01.b64 payload/chunk_02.b64 payload/chunk_03.b64 | tr -d '\n\r' > movego_payload.full.b64
          echo "Base64 bytes: $(wc -c < movego_payload.full.b64)"
          test "$(wc -c < movego_payload.full.b64)" -eq 27752
          base64 -d movego_payload.full.b64 > MoveGoApp.zip
          echo "be8bdb67b42c23e47bd6849cdde45ed77ff6d206d3af575d3fa9e688bbdb22dc  MoveGoApp.zip" | sha256sum -c -
          unzip -q MoveGoApp.zip
          test -f MoveGoApp/package.json
          ls -la MoveGoApp

      - name: Install dependencies
        working-directory: MoveGoApp
        run: |
          npm install --no-audit --no-fund
          npx expo install --fix
          npx expo install expo-font expo-system-ui
          npm ls expo expo-font expo-modules-core react-native || true

      - name: Generate Android project
        working-directory: MoveGoApp
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build installable APK
        working-directory: MoveGoApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp MoveGoApp/android/app/build/outputs/apk/debug/app-debug.apk MoveGo.apk
          ls -lh MoveGo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoveGo-APK
          path: MoveGo.apk
          if-no-files-found: error
          retention-days: 7
