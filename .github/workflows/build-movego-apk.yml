name: Build MoveGo APK

on:
  push:
    branches: [main]
    paths:
      - "movego_payload.b64"
      - ".github/workflows/build-movego-apk.yml"
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Restore original MoveGo project
        run: |
          git show eab3b964fb5db70447766b7d63bd1577d6075b83:movego_payload.b64 > movego_payload.original.b64
          echo "Payload bytes: $(wc -c < movego_payload.original.b64)"
          base64 -d movego_payload.original.b64 > MoveGoApp.zip
          unzip -q MoveGoApp.zip
          ls -la MoveGoApp

      - name: Install dependencies
        working-directory: MoveGoApp
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: MoveGoApp
        env:
          CI: "1"
        run: npx expo prebuild --platform android --clean

      - name: Build installable APK
        working-directory: MoveGoApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp MoveGoApp/android/app/build/outputs/apk/debug/app-debug.apk MoveGo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoveGo-APK
          path: MoveGo.apk
          if-no-files-found: error
          retention-days: 7
