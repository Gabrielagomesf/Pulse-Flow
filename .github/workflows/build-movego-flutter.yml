name: Build MoveGo Flutter APK

on:
  push:
    branches: [main]
    paths:
      - "flutter_payload/**"
      - ".github/workflows/build-movego-flutter.yml"
  workflow_dispatch:

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore MoveGo Flutter source
        run: |
          cat flutter_payload/chunk_00.b64 flutter_payload/chunk_01.b64 flutter_payload/chunk_02.b64 | tr -d '\n\r' > movego_flutter.b64
          test "$(wc -c < movego_flutter.b64)" -eq 22004
          base64 -d movego_flutter.b64 > MoveGoFlutter.zip
          echo "1c02ced7fd00e701dd74498c65dd71714b074bb71887fc3f09253ccfbd124a00  MoveGoFlutter.zip" | sha256sum -c -
          unzip -q MoveGoFlutter.zip
          test -f MoveGoFlutter/pubspec.yaml
          test -f MoveGoFlutter/lib/main.dart

      - name: Patch Dart source validation fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ride = Path("MoveGoFlutter/lib/screens/ride_options_screen.dart")
          s = ride.read_text()
          s = s.replace(
              "child: const Icon(Icons.chevron_left_rounded))))),",
              "child: const Icon(Icons.chevron_left_rounded))))))),",
          )
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if line.lstrip().startswith("Row(children: [Expanded(child: AppCard("):
                  lines[i] = """          AppCard(
            padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 12),
            onTap: () {},
            child: const Row(children: [
              Icon(Icons.credit_card_rounded, size: 19),
              SizedBox(width: 8),
              Expanded(child: Text('Mastercard •••• 4821', style: TextStyle(fontSize: 12, fontWeight: FontWeight.w800))),
              Icon(Icons.keyboard_arrow_down_rounded),
            ]),
          ),"""
                  break
          ride.write_text("\n".join(lines) + "\n")

          secondary = Path("MoveGoFlutter/lib/screens/secondary_screens.dart")
          lines = secondary.read_text().splitlines()
          for i, line in enumerate(lines):
              if "].map((e) => Padding(" in line:
                  lines[i] = """    ].map(
      (e) => Padding(
        padding: const EdgeInsets.only(bottom: 11),
        child: AppCard(
          onTap: onSearch,
          child: Row(children: [
            Container(
              width: 52,
              height: 52,
              decoration: BoxDecoration(color: AppColors.bg, borderRadius: BorderRadius.circular(18)),
              child: Icon(e[0] as IconData),
            ),
            const SizedBox(width: 13),
            Expanded(
              child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                Text(e[1] as String, style: const TextStyle(fontWeight: FontWeight.w900)),
                const SizedBox(height: 3),
                Text(e[2] as String, style: const TextStyle(color: AppColors.muted, fontSize: 11)),
              ]),
            ),
            const Icon(Icons.chevron_right_rounded),
          ]),
        ),
      ),
    ),"""
                  break

          start = next(i for i, line in enumerate(lines) if line.startswith("class DriverScreen extends StatefulWidget"))
          driver = """class DriverScreen extends StatefulWidget {
  const DriverScreen({super.key});

  @override
  State<DriverScreen> createState() => _DriverScreenState();
}

class _DriverScreenState extends State<DriverScreen> {
  bool online = false;
  bool request = false;

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      body: Stack(children: [
        const Positioned.fill(child: FakeMap(showCar: true)),
        SafeArea(
          child: Padding(
            padding: const EdgeInsets.all(16),
            child: Row(mainAxisAlignment: MainAxisAlignment.spaceBetween, children: [
              InkWell(
                onTap: () => Navigator.pop(context),
                child: Container(
                  width: 46,
                  height: 46,
                  decoration: const BoxDecoration(color: Colors.white, shape: BoxShape.circle),
                  child: const Icon(Icons.chevron_left_rounded),
                ),
              ),
              Container(
                padding: const EdgeInsets.symmetric(horizontal: 14, vertical: 9),
                decoration: BoxDecoration(color: Colors.white, borderRadius: BorderRadius.circular(17)),
                child: const Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                  Text('R\$ 126,80', style: TextStyle(fontWeight: FontWeight.w900)),
                  Text('hoje · 6 viagens', style: TextStyle(color: AppColors.muted, fontSize: 9)),
                ]),
              ),
            ]),
          ),
        ),
        Align(
          alignment: Alignment.bottomCenter,
          child: Container(
            padding: const EdgeInsets.fromLTRB(20, 20, 20, 24),
            decoration: const BoxDecoration(
              color: Colors.white,
              borderRadius: BorderRadius.vertical(top: Radius.circular(30)),
            ),
            child: SafeArea(
              top: false,
              child: Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [
                Text(
                  online ? 'Você está online' : 'Modo motorista',
                  style: const TextStyle(fontSize: 23, fontWeight: FontWeight.w900),
                ),
                const SizedBox(height: 4),
                Text(
                  online ? 'Recebendo solicitações próximas.' : 'Fique online para começar a receber viagens.',
                  style: const TextStyle(color: AppColors.muted, fontSize: 12),
                ),
                if (online && request) ...[
                  const SizedBox(height: 14),
                  AppCard(
                    color: AppColors.bg,
                    child: Row(children: [
                      const Expanded(
                        child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                          Text('Nova corrida · 2,3 km', style: TextStyle(fontWeight: FontWeight.w900)),
                          SizedBox(height: 4),
                          Text('Cambuí → Centro · R\$ 21,40', style: TextStyle(color: AppColors.muted, fontSize: 11)),
                        ]),
                      ),
                      Container(
                        padding: const EdgeInsets.all(10),
                        decoration: BoxDecoration(color: AppColors.accent, borderRadius: BorderRadius.circular(14)),
                        child: const Text('12s', style: TextStyle(fontWeight: FontWeight.w900)),
                      ),
                    ]),
                  ),
                ],
                const SizedBox(height: 14),
                PrimaryButton(
                  label: !online ? 'Ficar online' : !request ? 'Simular solicitação' : 'Aceitar corrida',
                  onPressed: () {
                    setState(() {
                      if (!online) {
                        online = true;
                      } else if (!request) {
                        request = true;
                      } else {
                        request = false;
                      }
                    });
                  },
                ),
                if (online)
                  SizedBox(
                    width: double.infinity,
                    child: TextButton(
                      onPressed: () => setState(() {
                        online = false;
                        request = false;
                      }),
                      child: const Text(
                        'Ficar offline',
                        style: TextStyle(color: AppColors.danger, fontWeight: FontWeight.w800),
                      ),
                    ),
                  ),
              ]),
            ),
          ),
        ),
      ]),
    );
  }
}
"""
          lines = lines[:start] + driver.splitlines()
          secondary.write_text("\n".join(lines) + "\n")
          PY

      - name: Generate Android project
        working-directory: MoveGoFlutter
        run: |
          flutter create . --platforms=android --org com.movego --project-name movego
          rm -rf test analysis_options.yaml

      - name: Get packages
        working-directory: MoveGoFlutter
        run: flutter pub get

      - name: Analyze Dart
        working-directory: MoveGoFlutter
        run: flutter analyze lib

      - name: Build standalone release APK
        working-directory: MoveGoFlutter
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          cp MoveGoFlutter/build/app/outputs/flutter-apk/app-release.apk MoveGo-Dart-Release.apk
          ls -lh MoveGo-Dart-Release.apk
          sha256sum MoveGo-Dart-Release.apk > MoveGo-Dart-Release.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoveGo-Dart-Release
          path: |
            MoveGo-Dart-Release.apk
            MoveGo-Dart-Release.sha256
          if-no-files-found: error
          retention-days: 7
